  <style>
  .leaf {
    transform-origin: 20px 20px;
    width: 50px;
    height: 50px;
    animation-timing-function: linear;
    animation-iteration-count: infinite;
    opacity: 0;
  }

  /* 5 animations différentes */
  .falling1 { animation-name: falling1; animation-duration: 5s; }
  .falling2 { animation-name: falling2; animation-duration: 5.5s; }
  .falling3 { animation-name: falling3; animation-duration: 6s; }
  .falling4 { animation-name: falling4; animation-duration: 5.3s; }
  .falling5 { animation-name: falling5; animation-duration: 5.7s; }

  /* Delays */
  .delay0 { animation-delay: 0s; }
  .delay1 { animation-delay: 1.7s; }
  .delay2 { animation-delay: 3.4s; }

  .color0 { fill: rgb(97, 97, 97); }
  .color1 { fill: rgb(255, 255, 255); }
  .color2 { fill: rgb(30, 30, 30); }
  .color3 { fill: rgb(0, 0, 0); }

  /* Keyframes avec trajectoires sinusoïdales approximatives et rotations */
  @keyframes falling1 {
    0% {
      transform: translate3d(520px, -20px, 0) rotate(0deg);
      opacity: 1;
    }
    30% {
      transform: translate3d(470px, 30px, 0) rotate(20deg);
    }
    60% {
      transform: translate3d(400px, 80px, 0) rotate(50deg);
    }
    90% {
      transform: translate3d(310px, 130px, 0) rotate(80deg);
    }
    100% {
      transform: translate3d(270px, 150px, 0) rotate(90deg);
      opacity: 0;
    }
  }

  @keyframes falling2 {
    0% {
      transform: translate3d(600px, -100px, 0) rotate(-10deg);
      opacity: 1;
    }
    25% {
      transform: translate3d(500px, 0, 0) rotate(0deg);
    }
    55% {
      transform: translate3d(330px, 100px, 0) rotate(45deg);
    }
    85% {
      transform: translate3d(200px, 160px, 0) rotate(75deg);
    }
    100% {
      transform: translate3d(100px, 210px, 0) rotate(85deg);
      opacity: 0;
    }
  }

  @keyframes falling3 {
    0% {
      transform: translate3d(600px, 80px, 0) rotate(15deg);
      opacity: 1;
    }
    20% {
      transform: translate3d(530px, 130px, 0) rotate(10deg);
    }
    50% {
      transform: translate3d(430px, 180px, 0) rotate(40deg);
    }
    75% {
      transform: translate3d(350px, 230px, 0) rotate(70deg);
    }
    100% {
      transform: translate3d(280px, 300px, 0) rotate(100deg);
      opacity: 0;
    }
  }

  @keyframes falling4 {
    0% {
      transform: translate3d(600px, 0, 0) rotate(-20deg);
      opacity: 1;
    }
    35% {
      transform: translate3d(490px, 100px, 0) rotate(15deg);
    }
    65% {
      transform: translate3d(450px, 200px, 0) rotate(50deg);
    }
    90% {
      transform: translate3d(320px, 290px, 0) rotate(85deg);
    }
    100% {
      transform: translate3d(280px, 320px, 0) rotate(95deg);
      opacity: 0;
    }
  }

  @keyframes falling5 {
    0% {
      transform: translate3d(515px, 0, 0) rotate(10deg);
      opacity: 1;
    }
    30% {
      transform: translate3d(470px, 90px, 0) rotate(20deg);
    }
    60% {
      transform: translate3d(420px, 180px, 0) rotate(60deg);
    }
    85% {
      transform: translate3d(350px, 280px, 0) rotate(80deg);
    }
    100% {
      transform: translate3d(300px, 330px, 0) rotate(90deg);
      opacity: 0;
    }
  }
  </style>

